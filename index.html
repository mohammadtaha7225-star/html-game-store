<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>فروشگاه HTML</title><link rel="manifest" href="manifest.json"><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f8fafc;font-family:Tahoma,Arial,sans-serif}header{padding:26px 18px;background:linear-gradient(135deg,#312e81,#0f172a)}h1{margin:0 0 8px;font-size:26px}.wrap{max-width:900px;margin:auto;padding:18px}.muted{color:#a5b4fc;font-size:14px}.status{padding:12px;border:1px solid #334155;border-radius:12px;margin:12px 0;background:#111827}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.game{background:#151d31;border:1px solid #293449;border-radius:16px;padding:16px}.game h3{margin:0 0 8px}.btn{border:0;border-radius:10px;padding:11px 15px;background:#7c3aed;color:white;font-weight:bold;cursor:pointer;margin:5px 0 0 5px}.btn.alt{background:#334155}.empty{text-align:center;padding:30px;color:#94a3b8}a{color:#c4b5fd}
</style></head><body><header><div class="wrap"><h1>🎮 فروشگاه HTML</h1><div class="muted">بازی‌ها را دریافت کن و حتی بدون اینترنت اجرا کن.</div></div></header><main class="wrap"><div id="status" class="status">در حال باز کردن فروشگاه…</div><div id="games" class="grid"></div><p class="muted">برای دیدن بازی‌های تازه، اینترنت را روشن کن و صفحه را تازه‌سازی کن.</p></main>
<script>
const GAME_CACHE='html-game-files-v1';
const status=document.getElementById('status'),root=document.getElementById('games');
function gameUrl(g){return new URL(g.url||g.path,location.href).href}
async function isCached(g){return !!(await caches.open(GAME_CACHE)).match(gameUrl(g))}
async function runGame(g){
 const cache=await caches.open(GAME_CACHE),url=gameUrl(g),response=await cache.match(url);
 if(!response){alert('اول بازی را با اینترنت دریافت کن.');return}
 const html=await response.text(),blob=new Blob([html],{type:'text/html'}),blobUrl=URL.createObjectURL(blob);
 const w=window.open(blobUrl,'_blank');if(!w){URL.revokeObjectURL(blobUrl);alert('اجازه بازشدن پنجره را بده.');}
}
async function load(){
 let games=[];
 try{
  const r=await fetch('database/games.json',{cache:'no-cache'});
  if(!r.ok)throw Error('فهرست در دسترس نیست');
  const data=await r.json();games=data.games||[];
  status.textContent='فهرست بازی‌ها به‌روز شد. برای اجرای آفلاین، بازی را یک‌بار دریافت کن.';
 }catch(e){status.textContent='اینترنت در دسترس نیست؛ فهرست ذخیره‌شده و بازی‌های قبلی را نشان می‌دهیم.';}
 if(!games.length){root.innerHTML='<div class="empty">هنوز بازی‌ای منتشر نشده است یا فهرست هنوز ذخیره نشده.</div>';return}
 root.innerHTML='';
 for(const g of games){
  const cached=await isCached(g),card=document.createElement('section');card.className='game';
  card.innerHTML='<h3></h3><p class="muted"></p><button class="btn"></button><button class="btn alt">اجرا</button>';
  card.querySelector('h3').textContent=g.title||'بازی';card.querySelector('p').textContent=g.description||'بازی HTML';
  const b=card.querySelector('.btn');b.textContent=cached?'دریافت دوباره':'دریافت بازی';
  b.onclick=async()=>{
   try{b.disabled=true;b.textContent='در حال دریافت…';
    const response=await fetch(gameUrl(g),{cache:'no-store'});if(!response.ok)throw Error('دانلود ناموفق');
    const cache=await caches.open(GAME_CACHE);await cache.put(gameUrl(g),response.clone());
    b.textContent='دریافت شد ✓';alert('بازی در کش برنامه ذخیره شد و آفلاین هم اجرا می‌شود.');
   }catch(e){b.textContent='دریافت بازی';alert('دریافت ناموفق بود؛ اینترنت را بررسی کن.');}
   finally{b.disabled=false;}
  };
  card.querySelector('.alt').onclick=()=>runGame(g);root.append(card);
 }
}
if('serviceWorker'in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
load().catch(e=>status.textContent='خطا: '+e.message);
</script></body></html>
