<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>فروشگاه HTML</title><link rel="manifest" href="manifest.json"><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f8fafc;font-family:Tahoma,Arial,sans-serif}header{padding:26px 18px;background:linear-gradient(135deg,#312e81,#0f172a)}h1{margin:0 0 8px;font-size:26px}.wrap{max-width:900px;margin:auto;padding:18px}.muted{color:#a5b4fc;font-size:14px}.status{padding:12px;border:1px solid #334155;border-radius:12px;margin:12px 0;background:#111827}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.game{background:#151d31;border:1px solid #293449;border-radius:16px;padding:16px}.game h3{margin:0 0 8px}.btn{border:0;border-radius:10px;padding:11px 15px;background:#7c3aed;color:white;font-weight:bold;cursor:pointer;margin:5px 0 0 5px}.btn.alt{background:#334155}.empty{text-align:center;padding:30px;color:#94a3b8}a{color:#c4b5fd}
</style></head><body><header><div class="wrap"><h1>🎮 فروشگاه HTML</h1><div class="muted">بازی‌ها را دریافت کن و حتی بدون اینترنت اجرا کن.</div></div></header><main class="wrap"><div id="status" class="status">در حال باز کردن فروشگاه…</div><div id="games" class="grid"></div><p class="muted">برای دیدن بازی‌های تازه، اینترنت را روشن کن و صفحه را تازه‌سازی کن.</p></main>
<script>
const DB='html-game-store-v1';let db;
function openDB(){return new Promise((ok,no)=>{let q=indexedDB.open(DB,1);q.onupgradeneeded=()=>q.result.createObjectStore('games');q.onsuccess=()=>{db=q.result;ok()};q.onerror=()=>no(q.error)})}
function get(id){return new Promise((ok,no)=>{let q=db.transaction('games').objectStore('games').get(id);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}
function put(id,val){return new Promise((ok,no)=>{let q=db.transaction('games','readwrite').objectStore('games').put(val,id);q.onsuccess=ok;q.onerror=()=>no(q.error)})}
async function runGame(g){let html=await get(g.id);if(!html){alert('اول بازی را با اینترنت دریافت کن.');return}let w=window.open('','_blank');if(!w){alert('اجازه بازشدن پنجره را بده.');return}w.document.open();w.document.write(html);w.document.close()}
async function load(){await openDB();const status=document.getElementById('status'),root=document.getElementById('games');let games=[];try{let r=await fetch('database/games.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();let data=await r.json();games=data.games||[];status.textContent='فهرست بازی‌ها از اینترنت به‌روز شد.'}catch(e){status.textContent='اینترنت در دسترس نیست؛ بازی‌های قبلاً دریافت‌شده را می‌بینی.'}
if(!games.length){root.innerHTML='<div class="empty">هنوز بازی‌ای منتشر نشده است.</div>';return}
root.innerHTML='';for(const g of games){let cached=!!(await get(g.id));let card=document.createElement('section');card.className='game';card.innerHTML='<h3></h3><p class="muted"></p><button class="btn"></button><button class="btn alt">اجرا</button>';card.querySelector('h3').textContent=g.title;card.querySelector('p').textContent=g.description||'بازی HTML';let b=card.querySelector('.btn');b.textContent=cached?'دریافت دوباره':'دریافت بازی';b.onclick=async()=>{try{let r=await fetch(g.url||g.path);if(!r.ok)throw Error();let html=await r.text();await put(g.id,html);b.textContent='دریافت شد ✓';alert('بازی ذخیره شد و آفلاین هم قابل اجراست.')}catch(e){alert('دانلود ناموفق بود. اینترنت و آدرس بازی را بررسی کن.')}};card.querySelector('.alt').onclick=()=>runGame(g);root.append(card)}}
if('serviceWorker'in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}load().catch(e=>document.getElementById('status').textContent='خطا در راه‌اندازی فروشگاه: '+e.message);
</script></body></html>
