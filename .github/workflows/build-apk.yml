name: Build Store and Admin APKs
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build both APKs
        run: gradle assembleStoreDebug assembleAdminDebug
      - name: Upload Game Store APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-FErooshgah-Bazi
          path: app/build/outputs/apk/store/debug/*.apk
          if-no-files-found: error
      - name: Upload Admin Panel APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Panel-Modiriat
          path: app/build/outputs/apk/admin/debug/*.apk
          if-no-files-found: error
