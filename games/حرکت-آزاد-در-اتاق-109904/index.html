<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>خانه بزرگ سه‌بعدی</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Tahoma,Arial,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}
#hint,#status,#look{color:#fff;background:#101820c9;border:1px solid #ffffff20;border-radius:12px;backdrop-filter:blur(6px)}
#hint{position:fixed;top:12px;right:12px;padding:10px 13px;font-size:12px;line-height:1.9;pointer-events:none}
#status{position:fixed;top:12px;left:12px;padding:9px 12px;font-size:12px;pointer-events:none}
#controls{position:fixed;bottom:16px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 16px;pointer-events:none}
#pad{display:grid;grid-template-columns:54px 54px 54px;grid-template-rows:54px 54px 54px;gap:5px;pointer-events:auto;direction:ltr}
button{border:1px solid #ffffff65;background:#142333d9;color:white;border-radius:16px;font-size:22px;box-shadow:0 3px 12px #0005;touch-action:none}button:active,button.on{background:#477eae}
#up{grid-column:2;grid-row:1}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
#look{font-size:11px;padding:9px 11px;max-width:135px;text-align:center;line-height:1.7;pointer-events:none}
#loading{position:fixed;inset:0;background:#18212a;color:white;display:grid;place-items:center;font-size:17px;z-index:4}
@media(min-width:800px){#pad{grid-template-columns:64px 64px 64px;grid-template-rows:64px 64px 64px}}
</style>
</head>
<body>
<div id="loading">در حال ساخت خانه سه‌بعدی…</div>
<div id="hint">با دکمه‌ها در خانه راه برو<br>برای چرخاندن دوربین، صفحه را بکش<br>خانه را کشف کن! 🏠</div>
<div id="status">خانه بزرگ · نمای اول‌شخص</div>
<div id="controls"><div id="pad"><button id="up">▲</button><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button></div><div id="look">انگشتت را روی تصویر بکش تا اطراف را ببینی</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const loading=document.getElementById('loading');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9eb8c9);scene.fog=new THREE.Fog(0x9eb8c9,24,55);
const camera=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,.1,100);camera.position.set(0,1.68,8.3);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe5f1ff,0x66513d,1.7));
const sun=new THREE.DirectionalLight(0xffe8c8,2.1);sun.position.set(-8,13,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=18;sun.shadow.camera.bottom=-18;scene.add(sun);
const fill=new THREE.PointLight(0xffd39a,38,24);fill.position.set(0,2.7,-1);scene.add(fill);
function mat(c,r=.8,m=0){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m})}
const M={wall:mat(0xe4ddd1),wall2:mat(0xd1c9bc),floor:mat(0x79583e,.7),trim:mat(0xf3eadc),wood:mat(0x68462f),wood2:mat(0x9a704c),cream:mat(0xeee6d8),fabric:mat(0xb9c7c6),dark:mat(0x303a40),green:mat(0x47784c),gold:mat(0xb78b4e,.35,.55)};
const obstacles=[];
function block(name,w,h,d,x,y,z,material,collide=false,shadow=true){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.name=name;o.position.set(x,y,z);o.castShadow=shadow;o.receiveShadow=true;scene.add(o);if(collide)obstacles.push({x,z,w,d});return o}
function wallX(x,z1,z2,openings=[]){let a=z1;for(const [s,e] of [...openings].sort((p,q)=>p[0]-q[0])){if(s>a)block('partition',.22,3.35,s-a,x,1.65,(a+s)/2,M.wall,true);a=e}if(z2>a)block('partition',.22,3.35,z2-a,x,1.65,(a+z2)/2,M.wall,true)}
function wallZ(z,x1,x2,openings=[]){let a=x1;for(const [s,e] of [...openings].sort((p,q)=>p[0]-q[0])){if(s>a)block('partition',s-a,3.35,.22,(a+s)/2,1.65,z,M.wall,true);a=e}if(x2>a)block('partition',x2-a,3.35,.22,(a+x2)/2,1.65,z,M.wall,true)}
// One large continuous floor and ceiling
block('house floor',24,.2,22,0,-.12,0,M.floor);block('ceiling',24,.18,22,0,3.35,0,mat(0xf0ece4),false,false);
// Exterior walls with a wide front entrance
wallZ(-11,-12,12);wallZ(11,-12,12,[[-1.25,1.25]]);wallX(-12,-11,11);wallX(12,-11,11);
// Five connected areas: living room, kitchen, corridor, bedroom and bathroom
wallX(-2,-11,11,[[-6.2,-3.8],[5.2,7.6]]);wallX(2,-11,11,[[-6.2,-3.8],[5.2,7.6]]);
wallZ(1,-12,-2,[[-8,-5.8]]);wallZ(1,2,12,[[5.8,8]]);
// Baseboards
for(const x of [-11.86,11.86])block('baseboard',.06,.16,21.7,x,.08,0,M.trim);
for(const z of [-10.86,10.86])block('baseboard',23.7,.16,.06,0,.08,z,M.trim);
// Floor boards
const planks=[0x896747,0x79583d,0x9a7651,0x76563d].map(c=>mat(c,.76));
for(let z=-10.7;z<10.8;z+=.62)block('floor plank',23.7,.012,.59,0,-.012,z,planks[Math.abs(Math.round(z*10))%4],false,false);
// Windows on outside walls
const glass=new THREE.MeshStandardMaterial({color:0x8fc9e8,roughness:.15,metalness:.12,emissive:0x315a70,emissiveIntensity:.28});
function windowBack(x,z,vertical=false){if(!vertical){block('window glass',2.4,1.45,.04,x,2.05,z,glass);for(const y of [1.3,2.8])block('window frame',2.55,.1,.12,x,y,z,M.trim);for(const xx of [x-1.25,x+1.25])block('window frame',.1,1.6,.12,xx,2.05,z,M.trim);block('window divider',.07,1.45,.13,x,2.05,z,M.trim)}else{block('window glass',.04,1.45,2.4,z,2.05,x,glass);for(const y of [1.3,2.8])block('window frame',.12,.1,2.55,z,y,x,M.trim);for(const zz of [x-1.25,x+1.25])block('window frame',.12,1.6,.1,z,2.05,zz,M.trim);block('window divider',.13,1.45,.07,z,2.05,x,M.trim)}}
windowBack(-7,-10.86);windowBack(7,-10.86);windowBack(-12,-5,true);windowBack(12,-5,true);windowBack(-7,10.86);windowBack(7,10.86);
// Living room (front-left)
block('large sofa base',4,.48,1.15,-7.3,.38,5.2,M.fabric,true);block('sofa back',4,.95,.28,-7.3,.92,5.65,M.fabric,true);
for(const x of [-8.65,-7.3,-5.95])block('sofa cushion',1.22,.18,.9,x,.72,5.12,mat(0xd4d9d2),true);
block('living coffee table',2.2,.14,1.15,-7.1,.55,2.8,M.wood2,true);for(const x of [-8,-6.2])for(const z of [2.35,3.25])block('table leg',.1,.5,.1,x,.25,z,M.wood);
block('TV cabinet',3,.5,.55,-7.2,.25,-.2,M.wood,true);block('television',2.5,1.45,.12,-7.2,1.25,-.48,M.dark,true);block('TV screen',2.3,1.25,.025,-7.2,1.27,-.4,mat(0x426477,.25));
block('living rug',5,.035,3.6,-7.2,.015,3.2,mat(0x8d9b91),false,false);
// Kitchen (front-right)
block('kitchen counter',7,.95,.85,7.4,.48,-8.9,mat(0xd8d0c3),true);block('counter top',7.1,.12,.95,7.4,1.0,-8.9,M.cream);
for(let x=4.6;x<=10.2;x+=1.4)block('cabinet door',1.25,.72,.06,x,.48,-8.43,mat(0x9b795a));
block('fridge',1.25,2.35,1.1,10.3,1.17,-6.8,mat(0xd7dedf,.35,.25),true);block('fridge handle',.06,.8,.08,9.65,1.3,-6.23,M.gold);
block('kitchen island',2.5,.95,1.3,6.3,.48,-5.6,M.wood,true);block('island top',2.65,.12,1.4,6.3,1.0,-5.6,M.cream);
for(const x of [5.5,7.1]){block('bar stool seat',.65,.15,.65,x,.72,-4.3,M.wood2,true);block('bar stool stem',.12,.65,.12,x,.36,-4.3,M.gold)}
// Dining table and chairs in kitchen
block('dining table',3,.14,1.6,6.8,.82,-1.9,M.wood2,true);for(const x of [5.6,8])for(const z of [-2.65,-1.15]){block('dining chair seat',.65,.14,.65,x,.5,z,M.wood,true);block('dining chair back',.65,.85,.12,x,.92,z+(z< -2?-.28:.28),M.wood)}
// Bedroom (back-left)
block('bed frame',3.3,.42,4,-7.2,.28,-5.8,M.wood,true);block('mattress',3.15,.25,3.85,-7.2,.62,-5.8,M.cream);block('bed cover',3.08,.16,2.5,-7.2,.8,-5.15,M.fabric);for(const x of [-8,-6.4])block('pillow',1.25,.18,.7,x,.84,-7.2,M.cream);block('headboard',3.45,1.15,.18,-7.2,.85,-7.9,M.wood2);
block('bedside table',.8,.7,.8,-9.5,.35,-7.6,M.wood,true);block('bedside top',.9,.08,.9,-9.5,.74,-7.6,M.wood2);block('wardrobe',2.6,2.5,.85,-3.8,1.25,-9.5,M.wood,true);for(const x of [-4.35,-3.25])block('wardrobe door',1.05,2.3,.06,x,1.25,-9.03,M.wood2);
// Bathroom (back-right)
block('bath floor mat',3,.035,2.2,7,.015,-5.5,mat(0x9caeae),false,false);block('bathtub',2.3,.65,1.2,9.2,.33,-8.7,mat(0xe9eeee,.25),true);block('bath rim',2.4,.12,1.3,9.2,.68,-8.7,M.cream);block('sink cabinet',1.5,.8,.8,4.2,.4,-8.7,M.wood,true);block('sink',1.25,.16,.65,4.2,.88,-8.7,mat(0xf3f4f0,.22));block('mirror',1.25,1.3,.06,4.2,1.9,-10.78,mat(0x91b8c5,.15,.6));block('toilet base',.65,.55,.85,5.3,.28,-4.2,M.cream,true);block('toilet tank',.65,.85,.22,5.3,.85,-4.65,M.cream);
// Hallway console, pictures and plants
block('hall console',2.2,.85,.55,0,.42,3.2,M.wood,true);block('hall console top',2.3,.1,.65,0,.9,3.2,M.wood2);block('hall mirror',1.25,1.6,.06,0,2.0,2.88,mat(0x9ebbc3,.2,.45));
function plant(x,z){const pot=new THREE.Mesh(new THREE.CylinderGeometry(.28,.2,.48,20),mat(0xb77956));pot.position.set(x,.24,z);pot.castShadow=true;scene.add(pot);for(let i=0;i<8;i++){const leaf=new THREE.Mesh(new THREE.SphereGeometry(.22,12,10),M.green);leaf.scale.set(.6,1.8,.55);leaf.position.set(x+Math.sin(i*2.4)*.25,.65+(i%3)*.13,z+Math.cos(i*2.4)*.25);leaf.rotation.z=(i-3)*.22;leaf.castShadow=true;scene.add(leaf)}}
plant(-10,9);plant(10,9);plant(-10,-9);plant(10,-1);
// Ceiling lights
for(const [x,z] of [[-7,4],[7,-6],[0,0],[-7,-5],[7,5]]){const disk=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.08,28),M.trim);disk.position.set(x,3.18,z);scene.add(disk);const bulb=new THREE.Mesh(new THREE.SphereGeometry(.16,16,12),new THREE.MeshBasicMaterial({color:0xffe5b5}));bulb.position.set(x,3.05,z);scene.add(bulb);const l=new THREE.PointLight(0xffd39a,15,9);l.position.set(x,2.75,z);scene.add(l)}
// Small room labels on wall plaques
function plaque(text,x,y,z,rot=0){const c=document.createElement('canvas');c.width=512;c.height=128;const ctx=c.getContext('2d');ctx.fillStyle='#73543b';ctx.fillRect(0,0,512,128);ctx.fillStyle='#fff4df';ctx.font='bold 54px Tahoma';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,256,65);const tex=new THREE.CanvasTexture(c);const p=new THREE.Mesh(new THREE.PlaneGeometry(1.8,.45),new THREE.MeshBasicMaterial({map:tex}));p.position.set(x,y,z);p.rotation.y=rot;scene.add(p)}
plaque('LIVING ROOM',-10,2.35,0.85);plaque('KITCHEN',10,2.35,-.2,Math.PI);plaque('BEDROOM',-10,2.35,1.2);plaque('BATHROOM',10,2.35,1.2,Math.PI);
// Collision helpers for furniture and boundaries
const furniture=[
{x:-7.3,z:5.2,w:4.2,d:1.45},{x:-7.2,z:-.2,w:3.2,d:.8},{x:-7.1,z:2.8,w:2.4,d:1.3},
{x:7.4,z:-8.9,w:7.2,d:1.1},{x:10.3,z:-6.8,w:1.5,d:1.35},{x:6.3,z:-5.6,w:2.8,d:1.6},{x:6.8,z:-1.9,w:3.2,d:1.8},
{x:-7.2,z:-5.8,w:3.6,d:4.2},{x:-3.8,z:-9.5,w:2.9,d:1.2},{x:9.2,z:-8.7,w:2.5,d:1.4},{x:4.2,z:-8.7,w:1.7,d:1.1},{x:5.3,z:-4.2,w:.9,d:1.2},{x:0,z:3.2,w:2.4,d:.8}
];obstacles.push(...furniture);
let yaw=0,pitch=0,keys={f:false,b:false,l:false,r:false};
function collides(x,z){if(x< -11.35||x>11.35||z< -10.35||z>10.35)return true;return obstacles.some(o=>Math.abs(x-o.x)<o.w/2+.28&&Math.abs(z-o.z)<o.d/2+.28)}
function setButton(id,key){const el=document.getElementById(id);const on=e=>{e.preventDefault();keys[key]=true;el.classList.add('on');el.setPointerCapture?.(e.pointerId)};const off=e=>{e.preventDefault();keys[key]=false;el.classList.remove('on')};el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('lostpointercapture',off)}
setButton('up','f');setButton('down','b');setButton('left','l');setButton('right','r');
let dragging=false,px=0,py=0;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;yaw-=dx*.004;pitch=Math.max(-1.05,Math.min(1.05,pitch-dy*.003))});renderer.domElement.addEventListener('pointerup',()=>dragging=false);renderer.domElement.addEventListener('pointercancel',()=>dragging=false);
addEventListener('keydown',e=>{if(['w','ArrowUp'].includes(e.key))keys.f=true;if(['s','ArrowDown'].includes(e.key))keys.b=true;if(e.key==='a')keys.l=true;if(e.key==='d')keys.r=true;if(e.key==='ArrowLeft')yaw+=.05;if(e.key==='ArrowRight')yaw-=.05});addEventListener('keyup',e=>{if(['w','ArrowUp'].includes(e.key))keys.f=false;if(['s','ArrowDown'].includes(e.key))keys.b=false;if(e.key==='a')keys.l=false;if(e.key==='d')keys.r=false});
let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.04);last=now;const speed=3.1*dt;const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));let dx=0,dz=0;if(keys.f){dx+=forward.x*speed;dz+=forward.z*speed}if(keys.b){dx-=forward.x*speed;dz-=forward.z*speed}if(keys.r){dx+=right.x*speed;dz+=right.z*speed}if(keys.l){dx-=right.x*speed;dz-=right.z*speed}const nx=camera.position.x+dx,nz=camera.position.z+dz;if(!collides(nx,camera.position.z))camera.position.x=nx;if(!collides(camera.position.x,nz))camera.position.z=nz;camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6))});loading.style.display='none';requestAnimationFrame(animate);
</script>
</body></html>
