<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>اتاق سه‌بعدی واقعی</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Tahoma,Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hint{position:fixed;top:12px;right:12px;color:#fff;background:#101820b8;padding:10px 13px;border-radius:12px;font-size:12px;line-height:1.8;pointer-events:none}
#status{position:fixed;top:12px;left:12px;color:#fff;background:#101820b8;padding:9px 12px;border-radius:12px;font-size:12px;pointer-events:none}
#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}
#pad{display:grid;grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px 56px;gap:5px;pointer-events:auto;direction:ltr}
button{border:1px solid #ffffff65;background:#142333c9;color:white;border-radius:16px;font-size:22px;box-shadow:0 3px 12px #0005;touch-action:none}
button:active,button.on{background:#477eae}
#up{grid-column:2;grid-row:1}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
#look{font-size:11px;color:#fff;background:#101820b8;padding:9px 12px;border-radius:12px;max-width:135px;text-align:center}
#loading{position:fixed;inset:0;background:#18212a;color:white;display:grid;place-items:center;font-size:17px;z-index:4}
@media(min-width:800px){#pad{grid-template-columns:64px 64px 64px;grid-template-rows:64px 64px 64px}}
</style>
</head>
<body>
<div id="loading">در حال ساخت اتاق سه‌بعدی…</div>
<div id="hint">با دکمه‌ها راه برو<br>برای نگاه کردن، صفحه را بکش</div>
<div id="status">نمای اول‌شخص · سه‌بعدی</div>
<div id="controls">
  <div id="pad">
    <button id="up">▲</button><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button>
  </div>
  <div id="look">انگشتت را روی تصویر بکش تا اطراف را ببینی</div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const loading=document.getElementById('loading');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bb4c5);
scene.fog=new THREE.Fog(0x9bb4c5,10,25);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,80);
camera.position.set(0,1.68,4.2);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
document.body.appendChild(renderer.domElement);

// Lighting: daylight through the window plus warm ceiling light
scene.add(new THREE.HemisphereLight(0xdcecff,0x6c5744,1.55));
const sun=new THREE.DirectionalLight(0xffe5c2,2.2);sun.position.set(-4,7,5);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-9;sun.shadow.camera.right=9;sun.shadow.camera.top=9;sun.shadow.camera.bottom=-9;scene.add(sun);
const warm=new THREE.PointLight(0xffc982,30,9);warm.position.set(0,2.65,-1);scene.add(warm);

function mat(color,rough=.8,metal=0){return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal})}
function box(name,w,h,d,x,y,z,material,shadow=true){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.name=name;m.position.set(x,y,z);m.castShadow=shadow;m.receiveShadow=true;scene.add(m);return m;
}
const wall=mat(0xd9d0c2),sidewall=mat(0xc6c0b5),floorMat=mat(0x79583d,.68),ceilingMat=mat(0xe8e2d8);
box('floor',10,.18,12,0,-.1,0,floorMat);
box('ceiling',10,.16,12,0,3.15,0,ceilingMat,false);
box('back wall',10,3.15,.18,0,1.5,-6,wall);
box('left wall',.18,3.15,12,-5,1.5,0,sidewall);
box('right wall',.18,3.15,12,5,1.5,0,sidewall);
box('front wall',10,3.15,.18,0,1.5,6,wall);
// wood floor boards
const plankMat=[0x896747,0x79583d,0x9a7651,0x6f5038].map(c=>mat(c,.72));
for(let z=-5.6;z<5.8;z+=.48){
  box('floor board',9.75,.018,.455,0,.005,z,plankMat[Math.abs(Math.round(z*10))%4],false);
}
const trim=mat(0xeee5d7);
for(const x of [-4.88,4.88])box('skirting',.05,.18,11.7,x,.1,0,trim,false);
box('back skirting',9.7,.18,.05,0,.1,-5.87,trim,false);

// Window on left wall, with frame and bright glass
const frame=mat(0xf4eee3,.35),glass=new THREE.MeshStandardMaterial({color:0x91c9e8,roughness:.12,metalness:.15,emissive:0x24465b,emissiveIntensity:.25});
box('window glass',.035,1.45,2.2,-4.88,2.05,-1.6,glass,false);
for(const y of [1.28,2.82])box('window frame',.12,.09,2.36,-4.82,y,-1.6,frame,false);
for(const z of [-2.75,-.45])box('window frame',.12,1.62,.09,-4.82,2.05,z,frame,false);
box('window crossbar',.13,.07,2.25,-4.78,2.05,-1.6,frame,false);
box('window vertical',.13,1.5,.07,-4.78,2.05,-1.6,frame,false);

// Bed against right side
const wood=mat(0x65442e),woodTop=mat(0x9b704b),white=mat(0xe7dfd1),linen=mat(0xb7c7cf),dark=mat(0x333d43);
box('bed frame',2.25,.38,3.25,3.25,.28,-2.7,wood);
box('mattress',2.15,.25,3.12,3.25,.58,-2.7,white);
box('duvet',2.08,.16,2.0,3.25,.78,-2.05,linen);
box('pillow',.85,.18,.62,2.7,.82,-4.0,white);
box('pillow',.85,.18,.62,3.75,.82,-4.0,white);
box('headboard',2.35,1.0,.16,3.25,.78,-4.38,woodTop);
for(const x of [2.25,4.25])for(const z of [-4.05,-1.35])box('bed leg',.13,.28,.13,x,.14,z,wood);

// Bedside table and lamp
box('nightstand',.8,.65,.7,1.85,.34,-4.15,wood);
box('nightstand top',.9,.08,.8,1.85,.71,-4.15,woodTop);
const lampBase= new THREE.Mesh(new THREE.CylinderGeometry(.16,.2,.08,24),woodTop);lampBase.position.set(1.85,.79,-4.15);scene.add(lampBase);
const lampStem=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.38,16),dark);lampStem.position.set(1.85,1.0,-4.15);scene.add(lampStem);
const shade=new THREE.Mesh(new THREE.ConeGeometry(.27,.35,24,1,true),mat(0xf2d8a5,.55));shade.position.set(1.85,1.32,-4.15);shade.rotation.x=Math.PI;scene.add(shade);

// Desk under window at rear left
box('desk legs',.12,.76,.12,-3.5,.38,-4.8,wood);
box('desk legs',.12,.76,.12,-1.8,.38,-4.8,wood);
box('desk legs',.12,.76,.12,-3.5,.76,-3.5,wood);
box('desk legs',.12,.76,.12,-1.8,.76,-3.5,wood);
box('desk top',2.0,.12,1.5,-2.65,.82,-4.15,woodTop);
box('monitor',1.0,.68,.08,-2.65,1.28,-4.55,dark);
box('monitor screen',.88,.55,.025,-2.65,1.3,-4.49,mat(0x426477,.28));
box('monitor stand',.12,.28,.12,-2.65,.98,-4.5,dark);
box('keyboard',.8,.04,.28,-2.65,.91,-3.8,mat(0x252a2e,.4));
box('desk chair seat',.85,.18,.8,-2.65,.53,-2.65,dark);
box('desk chair back',.85,.95,.16,-2.65,1.02,-2.98,dark);
for(const x of [-2.98,-2.32])box('chair leg',.07,.48,.07,x,.24,-2.65,dark);

// Rug and coffee table
const rug=mat(0x6c8790,.98);box('rug',3.3,.035,2.5,.1,.02,.5,rug,false);
box('coffee table top',1.6,.12,.9,.1,.55,.35,woodTop);
for(const x of [-.55,.75])for(const z of [0,.7])box('coffee table leg',.09,.52,.09,x,.27,z,wood);

// Bookshelf on back wall
for(const y of [.5,1.2,1.9,2.55]){
 box('shelf',1.45,.09,.48,-.25,y,-5.65,woodTop);
}
for(const x of [-.92,.42])box('bookcase side',.1,2.55,.5,x,1.35,-5.65,wood);
const bookColors=[0x9b5544,0x55716b,0xd0aa65,0x455b7b,0x9b8063];
for(let i=0;i<12;i++){
 const h=.35+(i%3)*.08;const b=box('book',.12,h,.28,-.8+(i%6)*.21,.55+h/2,-5.48,mat(bookColors[i%5],.9),false);b.rotation.z=(i%2?-.05:.04);
}
// Plant in corner
const potMat=mat(0xb76f4d);
const pot=new THREE.Mesh(new THREE.CylinderGeometry(.25,.18,.42,20),potMat);pot.position.set(-4.05,.21,-4.9);pot.castShadow=true;scene.add(pot);
const green=mat(0x3f7548);
for(let i=0;i<7;i++){const leaf=new THREE.Mesh(new THREE.SphereGeometry(.22,12,10),green);leaf.scale.set(.6,1.7,.55);leaf.position.set(-4.05+Math.sin(i*2.4)*.23,.65+(i%3)*.12,-4.9+Math.cos(i*2.4)*.23);leaf.rotation.z=(i-3)*.24;leaf.castShadow=true;scene.add(leaf)}

// Ceiling fixture
const fixture=mat(0xf4e4c5,.35);
const disc=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.08,32),fixture);disc.position.set(0,3.02,-1);scene.add(disc);
const bulb=new THREE.Mesh(new THREE.SphereGeometry(.14,16,12),new THREE.MeshBasicMaterial({color:0xffe2a8}));bulb.position.set(0,2.9,-1);scene.add(bulb);

// Picture on right wall
box('picture frame',.08,1.0,1.35,4.86,2.0,-.1,woodTop,false);
box('picture canvas',.025,.83,1.18,4.80,2.0,-.1,mat(0xb8c7bb),false);
const artMat=mat(0x597b73);
const art=new THREE.Mesh(new THREE.SphereGeometry(.32,20,16),artMat);art.scale.set(.12,1,1.4);art.position.set(4.77,2,-.1);scene.add(art);

// collision objects: room boundaries + furniture approximate
const obstacles=[
 {x:3.25,z:-2.7,w:2.35,d:3.35},
 {x:-2.65,z:-4.15,w:2.15,d:1.65},
 {x:.1,z:.35,w:1.75,d:1.05},
 {x:-.25,z:-5.65,w:1.6,d:.65},
 {x:1.85,z:-4.15,w:.95,d:.85}
];
let yaw=0,pitch=0,keys={f:false,b:false,l:false,r:false};
function collides(x,z){
 if(x< -4.55||x>4.55||z< -5.55||z>5.55)return true;
 return obstacles.some(o=>Math.abs(x-o.x)<o.w/2+.22&&Math.abs(z-o.z)<o.d/2+.22);
}
function setButton(id,key){
 const el=document.getElementById(id);
 const on=e=>{e.preventDefault();keys[key]=true;el.classList.add('on');el.setPointerCapture?.(e.pointerId)};
 const off=e=>{e.preventDefault();keys[key]=false;el.classList.remove('on')};
 el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('lostpointercapture',off);
}
setButton('up','f');setButton('down','b');setButton('left','l');setButton('right','r');
let dragging=false,px=0,py=0;
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;let dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;yaw-=dx*.004;pitch=Math.max(-1.05,Math.min(1.05,pitch-dy*.003));});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);renderer.domElement.addEventListener('pointercancel',()=>dragging=false);
addEventListener('keydown',e=>{if(['w','ArrowUp'].includes(e.key))keys.f=true;if(['s','ArrowDown'].includes(e.key))keys.b=true;if(['a'].includes(e.key))keys.l=true;if(['d'].includes(e.key))keys.r=true;if(e.key==='ArrowLeft')yaw+=.05;if(e.key==='ArrowRight')yaw-=.05});
addEventListener('keyup',e=>{if(['w','ArrowUp'].includes(e.key))keys.f=false;if(['s','ArrowDown'].includes(e.key))keys.b=false;if(e.key==='a')keys.l=false;if(e.key==='d')keys.r=false});
let last=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.04);last=now;
 const speed=2.5*dt;
 const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 let dx=0,dz=0;
 if(keys.f){dx+=forward.x*speed;dz+=forward.z*speed}
 if(keys.b){dx-=forward.x*speed;dz-=forward.z*speed}
 if(keys.r){dx+=right.x*speed;dz+=right.z*speed}
 if(keys.l){dx-=right.x*speed;dz-=right.z*speed}
 const nx=camera.position.x+dx,nz=camera.position.z+dz;
 if(!collides(nx,camera.position.z))camera.position.x=nx;
 if(!collides(camera.position.x,nz))camera.position.z=nz;
 camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;
 renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
loading.style.display='none';requestAnimationFrame(animate);
</script>
</body></html>
